<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Vibrant Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Hands Accent Gradient -->
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Premium Container -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" />

  <!-- Outer Ring (Clock Body) -->
  <circle cx="256" cy="256" r="144" fill="none" stroke="url(#ringGrad)" stroke-width="32" stroke-linecap="round" />

  <!-- Active Progress Arc (12 o'clock to 3 o'clock) -->
  <path d="M 256 112 A 144 144 0 0 1 400 256" fill="none" stroke="#38bdf8" stroke-width="36" stroke-linecap="round" filter="url(#glow)" />

  <!-- Center Pivot -->
  <circle cx="256" cy="256" r="22" fill="#ffffff" />

  <!-- Hour Hand -->
  <line x1="256" y1="256" x2="184" y2="184" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />

  <!-- Minute Hand -->
  <line x1="256" y1="256" x2="256" y2="140" stroke="url(#handGrad)" stroke-width="26" stroke-linecap="round" />

  <!-- Stylized Success Sparkle / Check Badge at top right -->
  <circle cx="370" cy="142" r="42" fill="#0f172a" stroke="#2563eb" stroke-width="6" />
  <path d="M 352 142 L 366 156 L 390 128" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
